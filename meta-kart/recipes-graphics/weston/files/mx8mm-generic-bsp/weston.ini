[core]
shell=kiosk-shell.so

[shell]
# weston 表示開始 (~4.3s) から kmm (~4.9s) までの背景。黒ではなく
# ダークトーンでブート連続感を出す (kiosk-shell は画像背景非対応)
background-color=0xff10141c
# パネルが物理表示するのは DE 左上 800x480 だけなので、クライアントには
# 800x480 と告げて左上等倍配置する (kiosk-shell パッチで追加した設定。
# weston_%.bbappend の 0001-kiosk-shell-client-size.patch)
client-size=800x480
xwayland=false
idle-time=0
require-input=false

[keyboard]
keymap_layout=jp

[output]
name=HDMI-A-1
# XPI (i.MX8MM) の開発用 800x480 パネル (TFP401 ドライバ基板) 向け固定モード。
# LT9611 (DSI→HDMI ブリッジ) は低ピクセルクロックで TX が不安定
# (実測: 〜33MHz=横揺れ / 40〜74MHz=無信号 / 108MHz・148.5MHz=安定) なため
# ラスタは実績の 108MHz 2200x818 を維持しつつ、アクティブ (DE) を
# 1920x792 まで黒埋めで広げる (充填率 87%)。DE が疎 (800/2200=36%) だと
# LT9611 PCR のロック位相が多安定になり、再ロックごとに横位相が抽選に
# なる (SPL スプラッシュ・weston 再起動で顕在化)。87% にすると一意化。
# パネルは DE の左上 800x480 だけを表示 (client-size=800x480 と対)。
# 経緯と実測マップは docs/imx8mm-xpi-bringup/04-pitfalls.md #17。
# 1080p モニタに繋ぐ場合はこの行を mode=1920x1080@60 に差し替える。
mode=108.0 1920 1988 2032 2200 792 796 801 818 +hsync +vsync

[libinput]
enable-tap=true
