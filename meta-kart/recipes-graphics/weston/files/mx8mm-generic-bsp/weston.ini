[core]
shell=kiosk-shell.so
xwayland=false
idle-time=0
require-input=false

[keyboard]
keymap_layout=jp

[output]
name=HDMI-A-1
# XPI (i.MX8MM) の開発用 800x480 パネル (TFP401 ドライバ基板) 向け固定モード。
# LT9611 (DSI→HDMI ブリッジ) は低ピクセルクロックで TX が不安定
# (実測: 〜33MHz=横揺れ / 40〜74MHz=無信号 / 108MHz・148.5MHz=安定) なため、
# 「108MHz の 2200x818 ラスタに 800x480 のアクティブ領域だけ置く」ことで
# ブリッジには高クロック、ガラスには native 相当の行/フレームレートを見せる。
# フレームバッファも 800x480 になるので描画コストは素の 480p。
# 経緯と実測マップは docs/imx8mm-xpi-bringup/04-pitfalls.md #17。
# 1080p モニタに繋ぐ場合はこの行を mode=1920x1080@60 に差し替える。
mode=108.0 800 888 932 2200 480 484 489 818 +hsync +vsync

[libinput]
enable-tap=true
