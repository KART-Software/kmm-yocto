# Mesa のシェーダディスクキャッシュを /data に置く (mx8mm のみ)。
# read-only rootfs では既定の ~/.cache が作れず毎起動フルコンパイルに
# なっていた ("Failed to create /home/kart/.cache ... disabling")。
# /data 常設で 2 回目以降のブートのコンパイルをスキップする。
# MAX_SIZE は /data が 128MB と小さいため既定 (1GB) から絞る。
[Service]
Environment=MESA_SHADER_CACHE_DIR=/data/mesa-cache
Environment=MESA_SHADER_CACHE_MAX_SIZE=32M
