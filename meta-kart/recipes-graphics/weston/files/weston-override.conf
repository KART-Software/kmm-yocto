[Unit]
# Clear all Requires and rebuild without weston.socket
Requires=
Requires=seatd.service systemd-user-sessions.service
After=seatd.service

[Service]
User=kart
Group=kart
WorkingDirectory=/home/kart
SupplementaryGroups=video input render tty

# Disable TTY/PAM settings from base unit (seatd handles seat access)
PAMName=
TTYPath=
TTYReset=no
TTYVHangup=no
TTYVTDisallocate=no
StandardInput=null
UtmpIdentifier=
UtmpMode=

# XDG_RUNTIME_DIR setup
ExecStartPre=+/bin/sh -c 'mkdir -p /run/user/%U && chmod 0700 /run/user/%U && chown kart:kart /run/user/%U'
Environment=XDG_RUNTIME_DIR=/run/user/%U
Environment=SEATD_SOCK=/run/seatd.sock

[Install]
WantedBy=multi-user.target
