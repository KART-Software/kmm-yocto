[core]
shell=kiosk-shell.so
xwayland=false
idle-time=0
require-input=false
# CPU 合成 (pixman)。クライアントは kmm (Qt Widgets = raster/wl_shm) と
# splash-wl (wl_shm) のみで GPU 合成が必須の絵が無く、Vivante EGL/GL の
# 初期化 ~130ms が丸ごと消える (kmm READY 3.57→3.44s、2026-09-02 実測)。
# 800x480 の CPU 合成負荷はアイドル ~0% で問題なし
renderer=pixman

[shell]
# 表示開始から kmm までの背景。8MM と同じ真っ黒 (スプラッシュ移植時にそのまま同化させる)
background-color=0xff000000

[keyboard]
keymap_layout=jp

[output]
name=LVDS-1
# mode 未指定 = パネルの唯一のモード (DTS の panel-lvds の panel-timing、800x480)。
# 上下左右の反転が要るときは transform= で (変換基板は L/R・U/D を反転なしに固定)

[libinput]
enable-tap=true
