[core]
shell=kiosk-shell.so
xwayland=false
idle-time=0
require-input=false

[shell]
# 表示開始から kmm までの背景。8MM と同じ真っ黒 (スプラッシュ移植時にそのまま同化させる)
background-color=0xff000000

[keyboard]
keymap_layout=jp

[output]
name=HDMI-A-1
# mode 未指定 = EDID の preferred。TFP401 LCD (800x480@32MHz) は 8MP HDMI PHY の
# クロック表に無いため EDID 側の対応が要る (docs/imx8mp-debix-bringup/03-first-boot.md)

[libinput]
enable-tap=true
