[core]
shell=kiosk-shell.so
xwayland=false
idle-time=0
require-input=false
# CPU 合成 (pixman)。クライアントは kmm (Qt Widgets = raster/wl_shm) と
# kart-splash-wl (wl_shm) のみで GPU 合成が必須の絵が無く、Vivante EGL/GL の
# 初期化 ~130ms が丸ごと消える (kmm READY 3.57→3.44s、2026-09-02 実測)。
# 800x480 の CPU 合成負荷はアイドル ~0% で問題なし
renderer=pixman

[shell]
# 表示開始から kmm までの背景。8MM と同じ真っ黒 (スプラッシュ移植時にそのまま同化させる)
background-color=0xff000000

[keyboard]
keymap_layout=jp

[output]
name=HDMI-A-1
# mode 未指定 = EDID の preferred。TFP401 LCD (800x480@32MHz) は 8MP HDMI PHY の
# クロック表に無いため EDID 側の対応が要る (docs/imx8mp-debix-bringup/03-first-boot.md)

[libinput]
enable-tap=true
