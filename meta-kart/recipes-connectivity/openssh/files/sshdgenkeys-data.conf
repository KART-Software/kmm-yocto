# SSH のホスト鍵を /data/ssh に機体ごとに 1 回だけ作る (openssh_%.bbappend を参照)
[Unit]
# 3 つとも揃っていれば走らせない。2 回目以降の起動では鍵の確認のスクリプトも起動しない
ConditionPathExists=|!/data/ssh/ssh_host_rsa_key
ConditionPathExists=|!/data/ssh/ssh_host_ecdsa_key
ConditionPathExists=|!/data/ssh/ssh_host_ed25519_key
# 初回の生成 (RSA が重い) を GUI の表示 (kmm の起動完了) より後に回す
After=kmm.service
