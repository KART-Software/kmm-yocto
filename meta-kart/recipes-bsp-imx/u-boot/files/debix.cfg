CONFIG_DEFAULT_FDT_FILE="imx8mp-debix.dtb"
# DEBIX には EVK の Type-C コントローラ (PTN5110/TCPC) が無い。
# 有効のままだと board_usb_init が tcpc_setup_ufp_mode で失敗し
# fastboot/ums が "USB init failed: -22" になる (2026-08-28 実測)。
# CONFIG_USB_TCPC is not set
# EVK 用の DSI→HDMI ブリッジ (ADV7535) ドライバ。DEBIX に無く、U-Boot の video_link が
# LCDIF1/MIPI DSI を途中まで立ち上げて失敗する。ベンダー defconfig も外している。
# CONFIG_VIDEO_ADV7535 is not set
# U-Boot の video サブシステムを丸ごと無効化。EVK 用 DTB のまま video_link が
# LCDIF1/MIPI DSI (RM67199 パネル) を叩いて失敗し、表示ハードを半端な状態で
# カーネルに渡す。ブートスプラッシュは 8MM 同様 SPL 側で別途設計するので不要。
# CONFIG_VIDEO is not set
