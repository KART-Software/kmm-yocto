# kart-uboot-slim.cfg: U-Boot の未使用機能を削って flash.bin と初期化時間を削減。
#
# - EFI_LOADER: UEFI アプリのブート機構。extlinux (sysboot) でしか起動しない
#   ので不要。単品で最大 (~150-250KB + 起動時の EFI サブシステム初期化)
# - NET: U-Boot 内の DHCP/TFTP。製品ブートは eMMC のみで、リカバリは
#   UUU (USB, ROM の serial download) なのでネットは使わない
#
# 注意: sysboot (extlinux) は CMD_SYSBOOT/PXE_UTILS であり NET 非依存。
# USB は UUU リカバリ経路のため残す。
# CONFIG_EFI_LOADER is not set
# CONFIG_NET is not set
