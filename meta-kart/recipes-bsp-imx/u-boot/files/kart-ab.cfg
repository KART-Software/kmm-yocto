# kart A/B (bootcount 方式) 用の U-Boot 設定
#
# BOOTCOUNT_LIMIT + BOOTCOUNT_ENV: upgrade_available=1 のときだけ bootcount を
# env に保存・毎ブート増加し、bootlimit 超過で altbootcmd を実行する
# (通常運転では saveenv しないので eMMC の摩耗もない)。
CONFIG_BOOTCOUNT_LIMIT=y
CONFIG_BOOTCOUNT_ENV=y

# env は製品では常に eMMC (U-Boot 番号 mmc2 = usdhc3) に置く。
# defconfig の 1 (SD) から変更。
CONFIG_SYS_MMC_ENV_DEV=2

# initial env 実測 3.5KB + A/B 変数で defconfig の 0x1000 を超えるため拡張。
# fw_env.config と kart-uboot-env の mkenvimage -s も同じ値であること。
CONFIG_ENV_SIZE=0x2000
