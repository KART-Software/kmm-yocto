# kart Falcon mode: SPL が U-Boot proper を飛ばしてカーネル直行する
# (kas/imx8mm-falcon.yml が SRC_URI に追加する実験オーバーレイ。
#  0001-imx8mm-kart-falcon-mode.patch とペア)
#
# 設計と根拠は docs/imx8mm-xpi-bringup/08-falcon.md。
CONFIG_SPL_OS_BOOT=y
# SPL を FS モード化 (注意: これで raw モードの proper 直読みは到達不能になり、
# フォールバックは FAT 上の u-boot.itb になる — R2)
CONFIG_SPL_FS_FAT=y
CONFIG_SPL_LIBDISK_SUPPORT=y
# SPL から U-Boot env (eMMC 4MiB) を読む (upgrade_available / boot_os)
CONFIG_SPL_ENV_SUPPORT=y
# falcon の args ファイルは FIT+ATF 設計では使わないが機構上必須 (ダミーを置く)
CONFIG_SPL_PAYLOAD_ARGS_ADDR=0x43000000
CONFIG_SPL_FS_LOAD_KERNEL_NAME="falcon.itb"
CONFIG_SPL_FS_LOAD_ARGS_NAME="args"
# -1 = MBR bootable フラグの立ったパーティション = A/B スロットセレクタ
CONFIG_SYS_MMCSD_FS_BOOT_PARTITION=-1
# FAT+env+glue で既定の 0x27000 を超えるため TCM の実余裕まで拡張。
# PAD_TO は MAX_SIZE 以上が必須 (config_fallbacks.h)。
# 上限検算: 0x30000 (196,608) + DDR training FW 58,524 = 255,132
#          <= TCM 天井 0x820000-0x7E1000 = 258,048
CONFIG_SPL_MAX_SIZE=0x30000
CONFIG_SPL_PAD_TO=0x30000
