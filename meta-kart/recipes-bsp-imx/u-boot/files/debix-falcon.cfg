# DEBIX Falcon mode: SPL が U-Boot proper を飛ばしてカーネル直行する
# (kas/imx8mp-falcon.yml が SRC_URI に追加。0002-imx8mp-debix-falcon-mode.patch とペア)
# 設計は 8MM と同一 (docs/imx8mm-xpi-bringup/08-falcon.md)。
CONFIG_SPL_OS_BOOT=y
# NXP 8MP SPL は既定で ROM API ロードのみ (BOOT_DEVICE_BOOTROM)。falcon は
# FAT 上の falcon.itb を読むため SPL に MMC/FAT スタックを足す
# (usdhc2/usdhc3 は imx8mp-evk-u-boot.dtsi で bootph 済み)。
CONFIG_SPL_MMC=y
CONFIG_SPL_DM_MMC=y
CONFIG_SPL_FS_FAT=y
CONFIG_SPL_LIBDISK_SUPPORT=y
# SPL から U-Boot env (eMMC 0x700000) を読む (upgrade_available / boot_os)
CONFIG_SPL_ENV_SUPPORT=y
# falcon の args ファイルは FIT+ATF 設計では使わないが機構上必須 (ダミー)
CONFIG_SPL_PAYLOAD_ARGS_ADDR=0x43000000
CONFIG_SPL_FS_LOAD_KERNEL_NAME="falcon.itb"
CONFIG_SPL_FS_LOAD_ARGS_NAME="args"
# -1 = MBR bootable フラグの立ったパーティション = A/B スロットセレクタ
CONFIG_SYS_MMCSD_FS_BOOT_PARTITION=-1
# MMC/FAT/env 追加で既定 0x26000 を超える。OCRAM 配置の検算:
#   SPL text 0x920000 + 0x2E000 = 0x94E000、その後に DDR training FW (~0x18000)
#   → 0x966000 < スタック天井 0x96dff0 (BSS 0x96e000)。
CONFIG_SPL_MAX_SIZE=0x2E000
CONFIG_SPL_PAD_TO=0x2E000
# SPL の env バックエンド (env/mmc.o の SPL 組み込み)。SPL_ENV_IS_NOWHERE が
# 立っていると依存関係で黙って落ちる (下の not set とセット。実機 env_init=-19 の教訓)
# CONFIG_SPL_ENV_IS_NOWHERE is not set
CONFIG_SPL_ENV_IS_IN_MMC=y
# デッドマンスイッチ: SPL が falcon 発動時に boot_os=no を書き戻すための env 書込
CONFIG_SPL_SAVEENV=y
CONFIG_SPL_MMC_WRITE=y
# SPL の DRAM ヒープ移動 (falcon の核心修正その 2)。defconfig の 0x42200000 は
# 0x40400000+30MB = カーネル Image (35.4MB) のロード範囲内で、FAT ドライバの
# 管理構造ごと踏み潰されて読込中にクラッシュする (実測: ~30MB 読込地点で
# リセット。8MM は Image < 30MB だったので無事だっただけ)。
# カーネル末尾 ~0x42720000 / args 0x43000000 / fdt 0x43100000 /
# FIT メタデータ退避 0x48000000 のどれとも重ならない位置へ
CONFIG_SPL_CUSTOM_SYS_MALLOC_ADDR=0x4A000000
# SPL の eMMC を HS400(ES) 化。falcon.itb 35MB の読みが 1.54s → 大幅短縮の狙い。
# proper は HS400 で同ファイル 107ms (実測)。SPL 用 DT の usdhc3 には
# mmc-hs400-1_8v / enhanced-strobe が元から付いており (imx8mp-evk-u-boot.dtsi)、
# 高速 pinctrl の bootph だけ 0003 パッチで補う
CONFIG_SPL_MMC_HS400_SUPPORT=y
CONFIG_SPL_MMC_HS400_ES_SUPPORT=y
# FAT 読みを 64B アラインで行う (実測では速度中立。アライン読みとして維持)
CONFIG_SPL_FS_FAT_DMA_ALIGN=y
