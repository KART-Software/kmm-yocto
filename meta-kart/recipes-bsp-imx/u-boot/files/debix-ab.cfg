# DEBIX A/B (bootcount 方式) 用の U-Boot 設定。中身の考え方は ab.cfg (8MM) と同じ。
# upgrade_available=1 のときだけ bootcount を保存・増加し、bootlimit 超過で altbootcmd。
CONFIG_BOOTCOUNT_LIMIT=y
CONFIG_BOOTCOUNT_ENV=y
# env は eMMC (U-Boot 番号 mmc2 = usdhc3)。defconfig の 1 (SD) から変更。
# オフセット/サイズは NXP defconfig 既定 (0x700000 / 0x4000) のまま — wks と
# fw_env.config はこの値に合わせてある。
CONFIG_SYS_MMC_ENV_DEV=2
# ab_boot が extlinux.conf を sysboot で起動する
CONFIG_CMD_SYSBOOT=y
# DEBIX に SPI NOR は無い。defconfig は MMC と SPI_FLASH の両 env を有効にして
# いて、SPL の env_init が SPI 側で迷う余地を消す (falcon の spl_start_uboot は
# env_init 失敗 = proper 委譲になるため、env 経路は決定論必須)
# CONFIG_ENV_IS_IN_SPI_FLASH is not set
# env の 2 面化 (open-issues #13): 保存は常に「今使っていない面」へ書き、書き込み中の
# 電源断で片面が壊れても残った面 (直前 1 回の変更を失うだけ) から起動する。
# 2 面目は 1 面目の直後 0x704000 (16KiB)。BOOTA (8MiB) までの空きに収まる。
# SPL (SPL_ENV_IS_IN_MMC/SPL_SAVEENV) も同じ env/mmc.c なので両面を読み書きする。
# fw_env.config (ab-tools) と uboot-env の初期イメージ (mkenvimage -r、2 面分) も同じ値。
CONFIG_SYS_REDUNDAND_ENVIRONMENT=y
CONFIG_ENV_OFFSET_REDUND=0x704000
