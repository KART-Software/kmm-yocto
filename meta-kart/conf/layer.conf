# We have a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have recipes-* directories, add to BBFILES
# Note: recipes-kernel is excluded from the glob and handled via BBFILES_DYNAMIC
# so that linux-raspberrypi bbappend only applies when meta-raspberrypi is present.
BBFILES += "${LAYERDIR}/recipes-app/*/*.bb \
            ${LAYERDIR}/recipes-app/*/*.bbappend \
            ${LAYERDIR}/recipes-connectivity/*/*.bb \
            ${LAYERDIR}/recipes-connectivity/*/*.bbappend \
            ${LAYERDIR}/recipes-core/*/*.bb \
            ${LAYERDIR}/recipes-core/*/*.bbappend \
            ${LAYERDIR}/recipes-devtools/*/*.bb \
            ${LAYERDIR}/recipes-devtools/*/*.bbappend \
            ${LAYERDIR}/recipes-graphics/*/*.bb \
            ${LAYERDIR}/recipes-graphics/*/*.bbappend \
            ${LAYERDIR}/recipes-support/*/*.bb \
            ${LAYERDIR}/recipes-support/*/*.bbappend \
            "

# Kernel bbappend only when meta-raspberrypi is present
BBFILES_DYNAMIC += "raspberrypi:${LAYERDIR}/recipes-kernel/*/*.bb \
                    raspberrypi:${LAYERDIR}/recipes-kernel/*/*.bbappend"

# i.MX kernel / bsp recipes only when meta-freescale is present
BBFILES_DYNAMIC += "freescale-layer:${LAYERDIR}/recipes-kernel-imx/*/*.bb \
                    freescale-layer:${LAYERDIR}/recipes-kernel-imx/*/*.bbappend \
                    freescale-layer:${LAYERDIR}/recipes-bsp-imx/*/*.bb \
                    freescale-layer:${LAYERDIR}/recipes-bsp-imx/*/*.bbappend"

BBFILE_COLLECTIONS += "kart"
BBFILE_PATTERN_kart = "^${LAYERDIR}/"
BBFILE_PRIORITY_kart = "10"

LAYERDEPENDS_kart = "core qt6-layer"
LAYERSERIES_COMPAT_kart = "scarthgap"
