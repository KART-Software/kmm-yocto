#@TYPE: Machine
#@NAME: Geniatech XPI-iMX8MM (kart)
#@SOC: i.MX8MM
#@DESCRIPTION: Geniatech XPI-iMX8MM (RNA200114) を kart 製品構成で正式定義した machine

# 経緯: bring-up 期は EVK machine (imx8mm-lpddr4-evk) を流用し、XPI の実態は
# kas フラグメントのパッチワークで上書きしていた。ここでその内容を machine
# レベルに吸収し、EVK からは SoC/boot 基盤 (imx8mm-evk.inc) だけを継承する。
# ハード実態の根拠は docs/imx8mm-xpi-bringup/07-vendor-bsp-audit.md。
require conf/machine/include/imx8mm-evk.inc

# ===== LPDDR4 構成の boot 基盤 (meta-freescale imx8mm-lpddr4-evk.conf 相当) =====
# XPI は EVK の LPDDR4 リファレンスをほぼ踏襲しており、SPL の DDR timing も
# NXP 純正 EVK 値で実機検証済み (07 §1。1GB 実装の個体だけは別 timing が必要)。
# U-Boot は EVK defconfig / EVK dts のまま (UBOOT_DTB_NAME が
# ${KERNEL_DEVICETREE_BASENAME}.dtb を指すため BASENAME は imx8mm-evk を維持)。
KERNEL_DEVICETREE_BASENAME = "imx8mm-evk"
UBOOT_CONFIG_BASENAME = "imx8mm_evk"
DDR_FIRMWARE_NAME = " \
    lpddr4_pmu_train_1d_imem.bin \
    lpddr4_pmu_train_1d_dmem.bin \
    lpddr4_pmu_train_2d_imem.bin \
    lpddr4_pmu_train_2d_dmem.bin \
"
IMXBOOT_TARGETS_BASENAME = "flash_evk"

# ===== XPI/kart の実態 =====

# WiFi/BT は不使用 (板載 88W8897 は usbotg2 ごと DT で切り離し済み — 07 §3-1)。
# EVK 定義が引き込む NXP out-of-tree WiFi ドライバは mainline 追従もしていない。
MACHINE_FEATURES:remove = "wifi bluetooth bcm43455 bcm4356 nxp8987-sdio"
# EVK の ath10k ファームウェアも不要 (イメージスリム化)
MACHINE_FIRMWARE:remove = "linux-firmware-ath10k"

IMAGE_FSTYPES = "wic wic.bz2 wic.bmap"

# XPI 実配線の DTB を素の名前で配置し、extlinux の FDT で直接指す。
# (旧構成は U-Boot 既定の fdtfile に合わせて imx8mm-evk.dtb へリネームする
# トリックを使っていた — extlinux.conf の FDT が明示パスなので不要になった)
# imx8mm-evk-kart.dtb は EVK 実機ベンチ用の同梱 (U-Boot から手動選択)。
# DTS 本体は meta-kart/recipes-kernel-imx/ の bbappend がビルドする。
IMAGE_BOOT_FILES = "Image imx8mm-xpi-kart.dtb imx8mm-evk-kart.dtb"
UBOOT_EXTLINUX_FDT:default:use-mainline-bsp = "../imx8mm-xpi-kart.dtb"
UBOOT_EXTLINUX_MENU_DESCRIPTION:default:use-mainline-bsp = "kart XPI-iMX8MM"

# 起動時間: quiet で printk のシリアル垂れ流しを止め、EDID はファームウェア
# ファイル供給 (LT9611 の DDC 読取 1.1〜1.4s を全廃。ファイルは kart-image が
# /lib/firmware/edid/ に配置)
UBOOT_EXTLINUX_KERNEL_ARGS = "rootwait rw quiet drm.edid_firmware=HDMI-A-1:edid/kart-tfp401-edid.bin"

# root= は U-Boot bbappend の間接変数 KART_EXTLINUX_ROOT 経由で kas
# フラグメント (SD シングルスロット / eMMC A/B) が選択する — 経緯は
# recipes-bsp-imx/u-boot/u-boot-fslc_%.bbappend のコメント参照
