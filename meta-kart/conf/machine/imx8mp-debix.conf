#@TYPE: Machine
#@NAME: Polyhex DEBIX Infinity
#@SOC: i.MX8MP
#@DESCRIPTION: Polyhex DEBIX Infinity (EMB-IMX8MP-06) を kart 製品構成で定義した machine

# 経緯: bring-up 期は EVK machine (imx8mp-lpddr4-evk) を流用 (kas/imx8mp.yml の
# スキャフォールド)。DEBIX Infinity は EVK 派生設計で、工場イメージも
# /boot/imx8mp-evk.dtb で起動している (docs/imx8mp-debix-bringup/00-plan.md 実測ログ)。
# imx8mm-xpi.conf と同じ流儀で、EVK からは SoC/boot 基盤 (imx8mp-evk.inc) だけ継承する。
require conf/machine/include/imx8mp-evk.inc

# ===== LPDDR4 構成の boot 基盤 (meta-freescale imx8mp-lpddr4-evk.conf 相当) =====
# 4GB (D4E32) は工場イメージ実測で U-Boot の memory fixup により全量認識。
# DDR timing も EVK 値で動いている前提 (工場 U-Boot が EVK 系のため)。
KERNEL_DEVICETREE_BASENAME = "imx8mp-evk"
UBOOT_CONFIG_BASENAME = "imx8mp_evk"
DDR_FIRMWARE_VERSION = "202006"
DDR_FIRMWARE_NAME = " \
    lpddr4_pmu_train_1d_dmem_${DDR_FIRMWARE_VERSION}.bin \
    lpddr4_pmu_train_1d_imem_${DDR_FIRMWARE_VERSION}.bin \
    lpddr4_pmu_train_2d_dmem_${DDR_FIRMWARE_VERSION}.bin \
    lpddr4_pmu_train_2d_imem_${DDR_FIRMWARE_VERSION}.bin \
"
IMXBOOT_TARGETS_BASENAME = "flash_evk"

# mainline BSP は 8MP の LPDDR4 init を持たない (meta-freescale の
# imx8mp-lpddr4-evk.conf と同じ理由)。8MM (mainline/u-boot-fslc) と違い
# NXP 系統: u-boot-imx + linux-fslc-imx + imx-atf。
IMX_DEFAULT_BSP = "nxp"

# ===== DEBIX の実態 =====

# DEBIX 実配線の DTB (EVK との差分は docs/imx8mp-debix-bringup/02-dts-delta.md、
# DTS 本体は recipes-kernel-imx の bbappend がビルド)。
# imx8mp-evk-rpmsg.dtb は M7 (remoteproc) 実験用の同梱 (01-m7.md)。
KERNEL_DEVICETREE:append = " \
    freescale/imx8mp-evk-rpmsg.dtb \
    freescale/imx8mp-debix.dtb \
"

# WiFi/BT (板載 88W8987) は本構成では不使用。EVK 定義が引き込む NXP/Marvell
# ドライバ・ファームウェア類も落とす (8MM と同じスリム化方針)。
# optee/jailhouse もこの構成では使わない — optee を外すと imx-boot が
# tee.bin 無しの構成になる (8MM と同じ SPL+ATF+U-Boot チェーン)。
MACHINE_FEATURES:remove = " \
    wifi bluetooth \
    nxp8997-pcie nxp8997-sdio nxp9098-pcie nxp9098-sdio \
    optee jailhouse mrvl8997 \
"
MACHINE_FIRMWARE:remove = "linux-firmware-ath10k"

IMAGE_FSTYPES = "wic wic.bz2 wic.bmap"

# extlinux (U-Boot sysboot) でカーネルを起動する。imx8mp-evk.inc はこれらを
# use-mainline-bsp 限定で定義しているので、NXP BSP のこの machine では自前で定義。
# root= は recipes-bsp-imx/u-boot/u-boot-imx_%.bbappend の KART_EXTLINUX_ROOT 経由。
UBOOT_EXTLINUX = "1"
UBOOT_EXTLINUX_LABELS = "default"
UBOOT_EXTLINUX_DEFAULT_LABEL = "DEBIX Infinity"
UBOOT_EXTLINUX_MENU_DESCRIPTION:default = "DEBIX Infinity"
UBOOT_EXTLINUX_FDT:default = "../imx8mp-debix.dtb"
UBOOT_EXTLINUX_CONSOLE:default = "console=ttymxc1,115200"
# EDID はファイル供給 (kart-edid-firmware)。パネル DDC は接続検出にだけ使われる
UBOOT_EXTLINUX_KERNEL_ARGS = "rootwait rw drm.edid_firmware=HDMI-A-1:edid/tfp401-edid-33m75.bin"
IMAGE_BOOT_FILES:append = " extlinux.conf;extlinux/extlinux.conf"

# eMMC A/B レイアウト (kas/imx-emmc-ab.yml が WKS_FILE に使う)
KART_EMMC_AB_WKS = "imx8mp-emmc-ab.wks"
