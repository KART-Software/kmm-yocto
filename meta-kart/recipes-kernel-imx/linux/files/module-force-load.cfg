# out-of-tree モジュール (kart-rpmsg-can 等) を vermagic 不一致でも
# modprobe --force-vermagic でロード可能にする保険。
#
# fslc カーネルのバージョン文字列生成は多層 (CONFIG_LOCALVERSION / make の
# LOCALVERSION env / fsl-kernel-localversion の .scmversion / AUTO) で、
# カーネル Image と out-of-tree モジュールの vermagic がわずかに食い違う
# ことがある。MODVERSIONS は無効かつ同一カーネルビルドなのでシンボル ABI は
# 一致しており、vermagic 文字列だけの不一致は force で安全に越えられる。
# 版文字列を完全一致させる修正 (LOCALVERSION="" 等) と併用し、万一残っても
# 起動サービスが --force-vermagic でロードできるようにしておく。
CONFIG_MODULE_FORCE_LOAD=y
