# drm.edid_firmware= でファイル供給の EDID を使う (DEBIX + TFP401 パネル)
CONFIG_DRM_LOAD_EDID_FIRMWARE=y
# NXP defconfig はユーザヘルパのフォールバックが有効で、見つからない firmware
# 要求が毎回 60s のヘルパ待ちになる。EDID を cmdline 供給すると rootfs マウント前の
# DRM プローブが要求してブート +60s、sdma の要求 2 件も各 60s 待ち (実測 2026-08-31)。
# 無効化すれば direct load の即時失敗 → 即時代替 (sdma=ROM ファーム、EDID=weston の
# 再プローブで rootfs から直読) になる。
# CONFIG_FW_LOADER_USER_HELPER_FALLBACK is not set
