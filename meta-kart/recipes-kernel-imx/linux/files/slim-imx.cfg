# slim-imx.cfg: RPi5 の slim/slim-aggressive/slim-modular で検証済みの
# 製品ポリシーを i.MX に移植 + arm64 defconfig 特有の大物を削除。
# ARCH 削減は slim-imx-arch.cfg (別ファイル) を参照。

# --- 仮想化 (カートに VM は無い。arm64 defconfig は KVM=y XEN=y) ---
# CONFIG_VIRTUALIZATION is not set
# CONFIG_KVM is not set
# CONFIG_XEN is not set

# --- シンボルテーブル (KALLSYMS 自体は oops のため残す) ---
# CONFIG_KALLSYMS_ALL is not set

# --- 電源状態 (マスタースイッチ断、毎回コールドブート、swap 無し) ---
# CONFIG_SUSPEND is not set
# CONFIG_HIBERNATION is not set
# CONFIG_SWAP is not set

# --- プロファイリング (運用でのカーネル計測は journalctl/UART で足りる) ---
# CONFIG_PROFILING is not set

# --- NFS (defconfig は =y。マウントしない) ---
# CONFIG_NFS_FS is not set
# CONFIG_SUNRPC is not set

# --- RAID/LVM (使わない) ---
# CONFIG_MD is not set

# --- IPv6: 製品判断で削除 (RPi5 と同方針) ---
# CONFIG_IPV6 is not set

# --- サウンド: i.MX の表示チェーン (lcdif/DSIM/ADV7535) は SND に依存しない
#     (RPi5 の vc4 とは違う)。HDMI 音声も使わないので丸ごと削除 ---
# CONFIG_SOUND is not set
# CONFIG_SND is not set
# CONFIG_SND_SOC is not set
# CONFIG_DRM_I2C_ADV7511_AUDIO is not set

# --- 無線 (有線 + LTE のみ。cfg80211/mac80211 のモジュールも不要) ---
# CONFIG_WLAN is not set
# CONFIG_CFG80211 is not set
# CONFIG_MAC80211 is not set
# CONFIG_BT is not set

# --- 入力 (タッチ/キーボード無し。デバッグ USB KB はモジュールで) ---
# CONFIG_INPUT_TOUCHSCREEN is not set
# CONFIG_INPUT_MOUSEDEV is not set
CONFIG_HID=m
CONFIG_HID_GENERIC=m
CONFIG_USB_HID=m

# --- =y→=m 移動 (RPi5 slim-modular と同じ判断):
#     /boot (vfat) は kart-boot-mount が userspace でマウント、
#     USB ストレージは製品未使用 ---
CONFIG_SCSI=m
CONFIG_BLK_DEV_SD=m
CONFIG_USB_STORAGE=m
# ATA (libata) は select SCSI で SCSI=y を強制する。ボードに SATA は無い。
# MEGARAID_SAS (サーバ用 RAID HBA! defconfig で =y) も同罪なので削除。
# CONFIG_ATA is not set
# CONFIG_MEGARAID_SAS is not set
CONFIG_VFAT_FS=m
CONFIG_FAT_FS=m
CONFIG_NLS_CODEPAGE_437=m
CONFIG_NLS_ASCII=m
CONFIG_NLS_ISO8859_1=m

# --- ブートロゴ ---
# CONFIG_LOGO is not set
