# boottune-imx8mp.cfg: 起動時間チューニング (open-issues #7、kernel→PID1 短縮)。
# initcall_debug プロファイル (2026-09-14) で kernel→PID1 0.77s の内訳を実測:
# deferred_probe_initcall 0.34s の大半がドライバ probe で、うち Ethernet が突出。
#
# --- FEC (eth0, 30be0000) をモジュール化 ---
# probe 実測: FEC MAC 201ms + GbE PHY (ethernet-1:01) 89ms = ~290ms を PID1 前で
# 同期消費していた (PHY リセット/MDIO 待ち。i.MX FEC の定番)。Ethernet は GUI に
# 不要 (OTA/Tailscale 用で GUI 後に上がれば十分) なので =m にして coldplug で
# ロードし、PID1 前の経路から外す。PHY ドライバは builtin のまま (fec.ko ロード時に
# MDIO バス生成 → bind、89ms もそのとき = PID1 後)。
CONFIG_FEC=m

# jitterentropy (jent_mod_init 27〜33ms/PID1前) は CONFIG_CRYPTO_DRBG が force-select
# するため単独では外せない (2026-09-14 実測: is not set が効かず =y のまま)。
# DRBG を切ると /dev/random バックエンドが変わり割に合わないので見送り。
