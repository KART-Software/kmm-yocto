# slim-imx8mp.cfg: NXP BSP カーネル (imx_v8_defconfig ベース) の減量。
# 8MM 版 (slim-imx.cfg / slim-imx-arch.cfg、mainline fslc 用) と方針は同じだが、
# ベース defconfig が別物なので独立ファイルにする (bbappend 冒頭コメント参照)。
#
# 注意 (2026-08-26 実測の罠): imx_v8_defconfig は VIRTIO_VIDEO=y を持ち、
# XEN だけ削ると依存の select が崩れてリンク不能になる。仮想化は
# XEN/KVM/VIRTIO/VIRTIO_VIDEO を一塊で消すこと。
# 適用後は pitfalls #15 の流儀で「defconfig の =y が .config に生きているか」
# の差分チェックを行う (select 崩壊は黙って起きる)。

# --- 仮想化一式 (カートに VM は無い) ---
# CONFIG_VIRTUALIZATION is not set
# CONFIG_KVM is not set
# CONFIG_XEN is not set
# CONFIG_VIRTIO_MENU is not set
# CONFIG_VIRTIO_VIDEO is not set

# --- 他 SoC ファミリ (imx_v8_defconfig は NXP 系列を全部抱える) ---
# CONFIG_ARCH_KEEMBAY is not set
# CONFIG_ARCH_LAYERSCAPE is not set
# CONFIG_ARCH_S32 is not set

# --- PINCTRL の明示 (pitfalls #15 の 8MP 版):
#     この木で CONFIG_PINCTRL を select するのは ARCH_S32 (と MEDIATEK) だけで、
#     ARCH_MXC は GPIOLIB しか select しない。S32 を削ると PINCTRL ごと
#     黙って消え、PINCTRL_IMX8MP=y も依存不成立で落ちる (初回ビルドで実測)。 ---
CONFIG_PINCTRL=y
CONFIG_PINCTRL_IMX8MP=y

# --- 電源状態 (マスタースイッチ断、毎回コールドブート、swap 無し) ---
# CONFIG_SUSPEND is not set
# CONFIG_HIBERNATION is not set
# CONFIG_SWAP is not set

# --- シンボル/プロファイリング ---
# CONFIG_KALLSYMS_ALL is not set
# CONFIG_PROFILING is not set

# --- NFS/RAID (使わない) ---
# CONFIG_NFS_FS is not set
# CONFIG_SUNRPC is not set
# CONFIG_MD is not set

# --- IPv6: 製品判断で削除 (RPi5/8MM と同方針) ---
# CONFIG_IPV6 is not set

# --- サウンド: kart は無音キオスク。8MP の表示 (lcdifv3/dw-hdmi) は
#     SND 非依存 (HDMI 音声は PAI 側で、使わない) ---
# CONFIG_SOUND is not set
# CONFIG_SND is not set
# CONFIG_SND_SOC is not set

# --- 無線 (有線のみ。BT の hci_uart/rfcomm/bnep の initcall も消える) ---
# CONFIG_WLAN is not set
# CONFIG_CFG80211 is not set
# CONFIG_MAC80211 is not set
# CONFIG_BT is not set
# CONFIG_RFKILL is not set

# --- カメラ/V4L2: カメラ非搭載。ISI/CSI/ISP/VPU の probe と Image が消える
#     (Quad Lite は VPU ヒューズアウト、DTB でも disabled 済み) ---
# CONFIG_MEDIA_SUPPORT is not set
# CONFIG_VIDEO_DEV is not set

# --- DSP (使わない。sound 系の相方) ---
# CONFIG_IMX_DSP is not set
# CONFIG_IMX_DSP_REMOTEPROC is not set

# --- 入力 (タッチ/キーボード無し。デバッグ USB KB はモジュールで) ---
# CONFIG_INPUT_TOUCHSCREEN is not set
# CONFIG_INPUT_MOUSEDEV is not set
CONFIG_HID=m
CONFIG_HID_GENERIC=m
CONFIG_USB_HID=m

# --- ストレージ: SATA 無し。ATA は select SCSI で SCSI=y を強制するので断つ。
#     USB ストレージ/vfat はモジュールで足りる (/boot は userspace マウント) ---
# CONFIG_ATA is not set
CONFIG_SCSI=m
CONFIG_BLK_DEV_SD=m
CONFIG_USB_STORAGE=m
CONFIG_VFAT_FS=m
CONFIG_FAT_FS=m
CONFIG_NLS_CODEPAGE_437=m
CONFIG_NLS_ASCII=m
CONFIG_NLS_ISO8859_1=m

# --- ブートロゴ (スプラッシュは SPL、ペンギンは不要) ---
# CONFIG_LOGO is not set

# ===== 第二弾: 表示系の他人 + MTD (2026-09-02) =====

# --- DEBIX の表示は lcdifv3 + DW-HDMI のみ。LVDS/DSI/DCSS 経路は他人 ---
# CONFIG_DRM_IMX_DCSS is not set
# CONFIG_DRM_IMX8MP_LDB is not set
# CONFIG_DRM_ITE_IT6263 is not set
# CONFIG_DRM_SAMSUNG_DSIM is not set
# CONFIG_DRM_I2C_ADV7511 is not set
# ↑ dmesg 常連だった「ldb Failed to create device link」「it6263 Probe failed」
#   のノイズ発生源でもある

# --- EVK 用 MIPI パネル群 (パネルは TFP401 直結 = パネルドライバ不要) ---
# CONFIG_DRM_PANEL_LVDS is not set
# CONFIG_DRM_PANEL_SIMPLE is not set
# CONFIG_DRM_PANEL_RAYDIUM_RM67191 is not set
# CONFIG_DRM_PANEL_RAYDIUM_RM68200 is not set
# CONFIG_DRM_PANEL_RAYDIUM_RM692C9 is not set
# CONFIG_DRM_PANEL_ROCKTECK_HIMAX8394F is not set
# CONFIG_DRM_PANEL_SEIKO_43WVF1G is not set
# CONFIG_DRM_PANEL_TIANMA_TM050RDH03 is not set
# CONFIG_DRM_PANEL_WKS_101WX001 is not set

# --- DSI/HDMI の他ブリッジ (NWL DSI ホスト、ADV7535、IT6161) ---
# CONFIG_DRM_NWL_MIPI_DSI is not set
# CONFIG_DRM_I2C_ADV7511 is not set
# CONFIG_DRM_ITE_IT6161 is not set

# --- MTD/SPI-NOR (FlexSPI に NOR 非搭載。spi-nor の JEDEC エラーも消える) ---
# CONFIG_MTD is not set

# --- GPU: 表示は pixman 合成 + Qt Widgets (raster) で GPU 不使用。
#     galcore (Vivante blob) は BAD_RECOMMENDATIONS で落とす。
#     CONFIG_DRM_ETNAVIV は =m で**残す** — 「is not set」にすると
#     ブート 0.18s で SError panic (2026-09-02 実測、falcon/proper 両経路)。
#     モジュール自体は runtime でロードされておらず、config を消したことで
#     builtin 側の共有部品が巻き添えで落ちる系 (PINCTRL と同族の select 崩壊)
#     と推定 — 機序の特定はしていない。触るなら実機ブート必須 ---
CONFIG_DRM_ETNAVIV=m
