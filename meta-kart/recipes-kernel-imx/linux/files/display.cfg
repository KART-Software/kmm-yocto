# EVK の表示チェーン (lcdif -> Samsung DSIM -> ADV7535 -> HDMI) と GPU を
# 組み込みにする。arm64 defconfig は全て =m で、weston 起動時に udev の
# モジュールロードと競合し得る (RPi5 では KMS が組み込みだった)。
# =y ならモジュールロード時間も消え、起動が決定論的になる。
CONFIG_DRM=y
CONFIG_DRM_MXSFB=y
CONFIG_DRM_SAMSUNG_DSIM=y
CONFIG_DRM_I2C_ADV7511=y
CONFIG_DRM_ETNAVIV=y
# XPI の DSI→HDMI ブリッジ (Lontium LT9611)
CONFIG_DRM_LONTIUM_LT9611=y
# lt9611 の port@2 が指す hdmi-connector ノードを bridge として登録する
# ドライバ。無いと lt9611_parse_dt の drm_of_find_panel_or_bridge が
# -EPROBE_DEFER を返し続け、lt9611 が永久に「failed to parse device tree」
CONFIG_DRM_DISPLAY_CONNECTOR=y
# drm_bridge_connector_init() は drm_display_helper 内。=m のままだと
# 組み込みの mxsfb からリンクできない (undefined reference)
CONFIG_DRM_DISPLAY_HELPER=y
