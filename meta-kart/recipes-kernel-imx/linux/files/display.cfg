# EVK の表示チェーン (lcdif -> Samsung DSIM -> ADV7535 -> HDMI) と GPU を
# 組み込みにする。arm64 defconfig は全て =m で、weston 起動時に udev の
# モジュールロードと競合し得る (RPi5 では KMS が組み込みだった)。
# =y ならモジュールロード時間も消え、起動が決定論的になる。
CONFIG_DRM=y
CONFIG_DRM_MXSFB=y
CONFIG_DRM_SAMSUNG_DSIM=y
CONFIG_DRM_I2C_ADV7511=y
CONFIG_DRM_ETNAVIV=y
# XPI の DSI→HDMI ブリッジ (Lontium LT9611)
CONFIG_DRM_LONTIUM_LT9611=y
