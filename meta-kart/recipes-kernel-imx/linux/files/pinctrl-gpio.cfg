# pinctrl / GPIO サブシステムの明示的な復活。
#
# slim-imx-arch.cfg が他ベンダー SoC (ARCH_*) を削った結果、CONFIG_PINCTRL /
# CONFIG_GPIOLIB のゲートを select する構成が消え、defconfig が明示していた
# PINCTRL_IMX8MM=y / GPIO_MXC=y も依存不成立で olddefconfig に黙って
# 落とされていた (fragment には一行も書いていないのに消える)。
#
# この欠落の実害 (XPI 実機で確認):
#  - 全デバイスが U-Boot が mux したパッドの残り物で動く
#    (UART2/ENET/eMMC は偶然動くが、I2C4/ECSPI2/GPIO 機能は死ぬ)
#  - fw_devlink が pinctrl グループ supplier を永遠に待ち、
#    LT9611 / MCP2515 / PMIC / cpufreq が deferred probe のまま
#  - imx2_wdt の一発 probe が失敗し 60 秒でウォッチドッグリセット
CONFIG_PINCTRL=y
CONFIG_PINCTRL_IMX8MM=y
CONFIG_GPIOLIB=y
CONFIG_GPIO_MXC=y
