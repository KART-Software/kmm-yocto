# imx2_wdt は必ずモジュールにする (=y だと文鎮リセットを踏む)。
#
# U-Boot (SPL) が WDOG1 を 60s タイムアウトで武装したままカーネルへ渡す。
# imx2_wdt は module_platform_driver_probe() (一発勝負・deferred probe 不可)
# なので、組み込み (=y) だと initcall 時点 (t≈0.24s) で supplier (iomuxc/clk)
# が未 probe → -ENODEV でドライバごと無言で登録解除され、誰も WDOG を
# サービスしないまま起動 60 秒後にハードリセットする (XPI 実機で 2 回再現、
# initcall_debug で確認)。素の arm64 defconfig 通り =m なら、モジュール
# ロード時 (rootfs 到達後、supplier 全部 ready) に probe が成功し、
# WDOG_HW_RUNNING 検出 → watchdog core が userspace が open するまで代打
# ping する (CONFIG_WATCHDOG_HANDLE_BOOT_ENABLED=y)。
CONFIG_IMX2_WDT=m
