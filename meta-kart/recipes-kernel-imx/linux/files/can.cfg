# CAN bus support for MCP2515 SPI CAN controller
CONFIG_CAN=y
CONFIG_CAN_RAW=y
CONFIG_CAN_BCM=y
CONFIG_CAN_GW=y
CONFIG_CAN_DEV=y
# MCP251X と SPI_IMX (ecspi) はビルトイン必須:
# =m だとロードが udev の platform/spi uevent 処理 (MODALIAS→modprobe) 頼みになり、
# kart-udev-slim の二段 coldplug で can0 が現れず kmm (After=can0-up) が凍結して
# 試行ブート監視のフォールバックが発動する (2026-08-12 実機で 2 敗して確定)。
# ビルトインならカーネル時点で can0 が存在し、udev 非依存 + 起動も決定論化する。
CONFIG_CAN_MCP251X=y
CONFIG_CAN_CALC_BITTIMING=y
CONFIG_SPI=y
CONFIG_SPI_IMX=y
