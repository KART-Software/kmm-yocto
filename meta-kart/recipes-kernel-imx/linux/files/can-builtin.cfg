# FlexCAN をビルトイン化 (DEBIX)。=m だとロードが udev の uevent 処理頼みになり、
# can0 がクリティカルパス (kmm は After=can0-up) に udev を挟む。8MM の
# can.cfg と同じ教訓 (docs/imx8mm-xpi-bringup/04-pitfalls.md「クリティカル
# パス上のドライバは =y にする」)。clk/pinctrl は NXP defconfig で元から =y。
CONFIG_CAN=y
CONFIG_CAN_RAW=y
CONFIG_CAN_DEV=y
CONFIG_CAN_FLEXCAN=y
