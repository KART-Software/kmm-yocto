# カーネルバージョン文字列を決定論化する。
#
# fslc defconfig は CONFIG_LOCALVERSION_AUTO=y のため scripts/setlocalversion
# が git describe を呼ぶ。これがビルド文脈で非決定的:
#   - カーネル本体の do_compile 時は fslc タグを拾い "-fslc-g<hash>" を付与
#     → uname = 6.12.20-fslc-fslc-g<hash> (fslc が 2 個)
#   - 共有ワークディレクトリ (out-of-tree モジュールが読む utsrelease.h) では
#     タグを拾えず "-g<hash>" のみ → 6.12.20-fslc-g<hash> (fslc が 1 個)
# 結果、同一イメージ内でもカーネルとモジュールの vermagic が食い違い、
# out-of-tree モジュール (kart-rpmsg-can 等) が modprobe できない。
#
# AUTO を切ると setlocalversion は git 情報を付けず、UTS_RELEASE は
# 6.12.20 + CONFIG_LOCALVERSION("-fslc") = "6.12.20-fslc" に固定される。
# カーネルとモジュールが常に一致し、ビルド間でも再現的になる
# (以前の「スロットのカーネル g<hash> を再現できない」問題も同時に解消)。
# git ハッシュはイメージ manifest / SRCREV 側に残るので追跡性は失わない。
# CONFIG_LOCALVERSION_AUTO is not set
