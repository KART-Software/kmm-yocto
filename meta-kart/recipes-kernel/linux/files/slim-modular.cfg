# slim-modular.cfg (2026-08): ファーム読込時間の削減第 3 弾。
#
# 原理: ファームウェアはカーネル Image を ~35MB/s でしか読めない (実測) が、
# 起動後のカーネルは NVMe から 500MB/s 超で読める。よって「削除」ではなく
# =y → =m 変換でバイトをファーム段から userspace 段へ移すのが本体。
# モジュールは kernel-modules パッケージで全部イメージに入る。
#
# 効果検証は UART 計測 (複数サンプル必須 — research ログ §14/§15) で行う。

# --- IPv6: 製品判断で完全削除 (元は =m なので Image サイズには中立。
#     tailscale の v6 direct 経路は失われ IPv4/DERP になる) ---
# CONFIG_IPV6 is not set

# --- SCSI スタック: USB ストレージ専用だった。製品に USB ディスクは無い。
#     NVMe は SCSI 非依存、SD は MMC。~1MB 級の最大の弾 ---
CONFIG_SCSI=m
CONFIG_BLK_DEV_SD=m
CONFIG_USB_STORAGE=m

# --- vfat: /boot は kart-boot-mount (userspace) がマウントするので
#     mount(8) のモジュール自動ロードで足りる ---
CONFIG_VFAT_FS=m
CONFIG_FAT_FS=m
CONFIG_NLS_CODEPAGE_437=m
CONFIG_NLS_ASCII=m
CONFIG_NLS_ISO8859_1=m

# --- USB ホスト (xhci): ブートに不要。LTE ドングルは起動後の udev で間に合う ---
CONFIG_USB_XHCI_HCD=m
CONFIG_USB_XHCI_PCI=m

# --- HID / 入力: 製品に入力デバイス無し。デバッグ用 USB キーボードは
#     ホットプラグでモジュールロードされる (evdev は =y のまま残す) ---
CONFIG_HID=m
CONFIG_HID_GENERIC=m
CONFIG_USB_HID=m
# CONFIG_INPUT_MOUSEDEV is not set
# CONFIG_INPUT_KEYBOARD is not set

# --- シンボルテーブル: FTRACE/KPROBES 削除済みの今、全シンボルは不要。
#     KALLSYMS 自体は残す (oops が読める)。
#     LATENCYTOP が KALLSYMS_ALL を select しているため先にそちらを消す
#     (レイテンシプロファイラ。この製品の運用では未使用) ---
# CONFIG_LATENCYTOP is not set
# CONFIG_KALLSYMS_ALL is not set

# --- swap 無し運用 (マスタースイッチ断、スワップデバイス無し) ---
# CONFIG_SWAP is not set

# --- ブートロゴ (cmdline logo.nologo で既に無効。コードごと落とす) ---
# CONFIG_LOGO is not set
