# Aggressive kernel slimming (2026-07): built-in (=y) subsystems we never use.
# (slim.cfg = safe periphery; this file = the aggressive cuts you may want
# back for kernel-level debugging.)
# Goal: shrink Image (27.5MB) -> faster bootloader kernel read + less init.
# Re-enabling any of these for a debug kernel is cheap now: delete the line,
# rebuild, ota-update (no SSD access needed).

# --- Virtualization (no VMs on a kart) ---
# CONFIG_VIRTUALIZATION is not set
# CONFIG_KVM is not set

# --- NFS client (userspace nfs was removed long ago; kernel side remained) ---
# CONFIG_NFS_FS is not set
# CONFIG_SUNRPC is not set

# --- Filesystems we never mount (ext4 + vfat only) ---
# CONFIG_F2FS_FS is not set

# --- Power states unusable here (RPi5 has no S3; no swap; master switch
#     cuts power, every boot is a cold boot) ---
# CONFIG_SUSPEND is not set
# CONFIG_HIBERNATION is not set

# --- USB device/gadget mode (we are host-only) ---
# CONFIG_USB_GADGET is not set

# --- Kernel instrumentation: never used in this product's debugging
#     (journalctl/UART/vclog cover us). Re-enable via OTA when a kernel-level
#     investigation (e.g. mcp2515 IRQ latency) actually needs it. ---
# CONFIG_PROFILING is not set
# CONFIG_KPROBES is not set
# CONFIG_FTRACE is not set

# --- No touch panel on the dash ---
# CONFIG_INPUT_TOUCHSCREEN is not set
