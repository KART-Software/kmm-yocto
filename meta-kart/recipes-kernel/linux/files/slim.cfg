# Disable unused subsystems for kart appliance
# Safe-to-remove: features clearly not used in this product.
# If boot fails, remove this fragment from bbappend SRC_URI first.

# --- Bluetooth (MACHINE_FEATURES already removes BT, disable kernel too) ---
# CONFIG_BT is not set
# CONFIG_BT_BREDR is not set
# CONFIG_BT_LE is not set
# CONFIG_BT_HCIUART is not set
# CONFIG_BT_HCIBTUSB is not set
# CONFIG_BT_HCIBCM203X is not set
# CONFIG_BT_RTL is not set
# CONFIG_BT_QCA is not set

# --- Wireless / WiFi (wired only) ---
# CONFIG_WLAN is not set
# CONFIG_CFG80211 is not set
# CONFIG_MAC80211 is not set
# CONFIG_WIRELESS is not set
# CONFIG_BRCMFMAC is not set
# CONFIG_BRCMUTIL is not set

# --- Sound / ALSA ---
# NOTE: DRM_VC4 depends on SND && SND_SOC on Raspberry Pi kernel,
# so we MUST keep SND/SND_SOC enabled or HDMI output breaks.
# Do NOT disable CONFIG_SOUND / CONFIG_SND here.

# --- IR / Remote control ---
# CONFIG_RC_CORE is not set
# CONFIG_MEDIA_RC_SUPPORT is not set
# CONFIG_LIRC is not set

# --- Joystick / Tablet / Touchscreen kernel input (we use touch via Qt) ---
# CONFIG_INPUT_JOYSTICK is not set
# CONFIG_INPUT_TABLET is not set

# --- V4L2 / Camera / Media (CSI camera not used) ---
# CONFIG_MEDIA_SUPPORT is not set
# CONFIG_VIDEO_DEV is not set

# --- Legacy filesystems we don't mount ---
# CONFIG_REISERFS_FS is not set
# CONFIG_JFS_FS is not set
# CONFIG_XFS_FS is not set
# CONFIG_NTFS_FS is not set
# CONFIG_HFS_FS is not set
# CONFIG_HFSPLUS_FS is not set

# --- Amateur Radio (obvious) ---
# CONFIG_HAMRADIO is not set

# --- NFC ---
# CONFIG_NFC is not set
