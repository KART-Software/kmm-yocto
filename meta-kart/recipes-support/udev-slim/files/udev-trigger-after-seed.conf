# coldplug (udev-trigger) を data-mount + seed credit の後に回す。
#
# 電源断起動では /data の ext4 journal recovery と seed の load/write + sync が
# 毎回走り、これが coldplug の blkid/モジュールロードと同じ eMMC を取り合って
# 電源→GUI が 3.19〜3.25 / 3.34〜3.42s の二峰になっていた (差は data-mount 完了→
# seed 完了の区間だけに出る。30-boot-time.md 09-11 行)。直列化すると 3.19s σ0.02
# の単峰 (N=6 実機)。GUI レーン (weston は card0 の devtmpfs ノード待ち、kmm は
# wayland ソケット待ち、rpmsgcan0 は modules-load 経由) は coldplug に依存しない
# ので影響なし。遅れるのはネット IF 等ノイズ系だけ (~0.3s)。udevd 自体は先に上がる。
[Unit]
After=systemd-random-seed.service
