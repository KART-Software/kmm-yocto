# 前回保存した乱数 seed を「信用」して CRNG を即時初期化する。
#
# 背景: udev ルール削減の実験中、coldplug 遅延で CRNG 初期化が ~4.6s まで
# ずれて weston の EGL 初期化が getrandom() で ~1.3s ブロックする実測問題が
# 出た (デバイス登録イベントは隠れたエントロピー源)。二段 coldplug 自体は
# 撤収したが、seed credit は CRNG ready を決定論化する独立の改善として残す。
#
# seed の実体は /data/random-seed (read-only rootfs のため image 側で
# /var/lib/systemd/random-seed → /data/random-seed のシンボリックリンクを張る。
# kart-image.bb の slim_udev_rules 参照)。サービスが毎起動+シャットダウンで
# 書き換えるため再利用は電源断時のみ、キオスク用途では許容する。
[Unit]
After=kart-data-mount.service

[Service]
Environment=SYSTEMD_RANDOM_SEED_CREDIT=1
