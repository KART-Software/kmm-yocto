; Teensy 4.0 — XPI-i.MX8MM 用デュアル UART ⇔ USB CDC ブリッジ
;
; USB_DUAL_SERIAL で Teensy が 2 本の USB CDC シリアルとして列挙される:
;   Serial     (1 本目, if00) <-> Serial1 (pin 0/1)  : A コアコンソール
;   SerialUSB1 (2 本目, if02) <-> Serial2 (pin 7/8)  : M コアコンソール

[env:teensy40]
platform = teensy
board = teensy40
framework = arduino
build_flags = -D USB_DUAL_SERIAL
monitor_speed = 115200
