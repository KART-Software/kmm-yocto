header:
  version: 14

machine: raspberrypi5

repos:
  meta-raspberrypi:
    url: https://github.com/agherzan/meta-raspberrypi.git
    branch: scarthgap
    layers:
      .:

local_conf_header:
  rpi5-machine: |
    MACHINE_FEATURES:remove = "bluetooth wifi"

  rpi5-license: |
    LICENSE_FLAGS_ACCEPTED:append = " synaptics-killswitch"

  rpi5-image: |
    IMAGE_FSTYPES = "wic wic.bz2 wic.bmap"

  rpi5-spi-can: |
    ENABLE_SPI_BUS = "1"
    ENABLE_CAN = "1"
    CAN_OSCILLATOR = "12000000"
    CAN0_INTERRUPT_PIN = "25"

  rpi5-gpu: |
    GPU_MEM = "256"
    DISABLE_OVERSCAN = "1"

  rpi5-serial: |
    ENABLE_UART = "1"

  rpi5-pcie: |
    RPI_EXTRA_CONFIG = "dtparam=pciex1\ndtparam=pciex1_gen=3\nboot_delay=0\ndisable_splash=1"

  rpi5-cmdline: |
    CMDLINE:append = " quiet loglevel=3"
    DISABLE_RPI_BOOT_LOGO = "1"
    # PID1 の mountinfo レートリミッタ (デフォルト 5/s) が起動初期の sandbox
    # マウントストームで発動し、マウントユニット処理が ~1s 凍結して boot が
    # 二峰性 (+0.9s) になっていた。カーネル未解釈の KEY=VALUE は init (PID1)
    # の環境変数として渡される。実測: 電源→UI 9.06-9.42s → 8.65s ±0.03s。
    CMDLINE:append = " SYSTEMD_DEFAULT_MOUNT_RATE_LIMIT_BURST=100"
