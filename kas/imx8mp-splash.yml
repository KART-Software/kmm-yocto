# DEBIX (8MP) SPL スプラッシュオーバーレイ — imx8mp-falcon.yml の後ろに付ける:
#
#   kas-container build kas/imx8mp-dev.yml:kas/imx-emmc-ab.yml:kas/imx8mp-falcon.yml:kas/imx8mp-splash.yml
#
# SPL が表示チェーンを直接叩き、ロゴ (p1 の logo.bin、imx8mp-falcon.yml が BOOT に入れる) を
# 電源投入直後に表示する。表示は machine の DEBIX_DISPLAY に従う (既定 lvds = J10 の LVDS
# パネル、kas/imx8mp-hdmi.yml で hdmi):
#   lvds: J10 の 5 V → VIDEO_PLL1 → MEDIAMIX → LCDIF2 → LDB → LVDS PHY (0009、debix-splash-lvds.cfg)
#   hdmi: GPC → blk-ctrl → Samsung PHY → DW-HDMI → PVI → LCDIFv3 (0005)
# SPL に入るのは片方だけ (ROM のブートイメージの上限)。U-Boot の表示の設定は machine conf の
# DEBIX_SPLASH_UBOOT_CFG が表示に合わせる。カーネルの引き継ぎのパッチ (HDMI 0010-0013、
# LVDS 0015-0018) は表示ごとに常に入っている (linux-fslc-imx_%.bbappend。SPL が /chosen に
# 印を立てたときだけ働く)。設計と定数の出典は docs/imx8mp-debix-bringup/06-splash.md。
# 0005 は 0002 (falcon) の上に、0009 は 0005/0006 の上に当たる。
header:
  version: 14

local_conf_header:
  splash: |
    SRC_URI:append:pn-u-boot-imx = " file://debix-splash.cfg ${DEBIX_SPLASH_UBOOT_CFG} file://0005-imx8mp-debix-spl-splash.patch file://0006-imx8mp-debix-proper-splash-adopt.patch file://0009-imx8mp-debix-spl-splash-lvds.patch file://spl_splash_logo.h"
