# SDK overlay: append to a machine config to build the Qt SDK installer, e.g.
#   kas-container shell kas/rpi5-prod.yml:kas/boot-nvme.yml:kas/sdk.yml \
#       -c "bitbake meta-toolchain-qt6"
# Output: build/tmp/deploy/sdk/poky-glibc-x86_64-meta-toolchain-qt6-*.sh
#
# アプリ (app-cpp) は Widgets/Gui/Network/Core しか使わないので、
# meta-toolchain-qt6 デフォルトの全 Qt モジュール (qtdeclarative,
# qtmultimedia, qt3d, ...) を落として qtbase だけに絞る。
# インストーラは ~1GB / 全モジュール版は数時間ビルドコース。
header:
  version: 14

local_conf_header:
  kart-sdk-slim: |
    TOOLCHAIN_HOST_TASK:remove:pn-meta-toolchain-qt6 = "nativesdk-packagegroup-qt6-toolchain-host"
    TOOLCHAIN_HOST_TASK:append:pn-meta-toolchain-qt6 = " nativesdk-cmake nativesdk-make nativesdk-ninja nativesdk-qtbase-dev nativesdk-qtbase-tools"
    TOOLCHAIN_TARGET_TASK:remove:pn-meta-toolchain-qt6 = "packagegroup-qt6-modules"
    TOOLCHAIN_TARGET_TASK:append:pn-meta-toolchain-qt6 = " qtbase-dev"
