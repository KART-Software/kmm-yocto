header:
  version: 14

# アプリ更新時は refspec と KART_APP_REVISION を同じコミットハッシュに揃えること。
# refspec: kas がクローンするコミット
# KART_APP_REVISION: BitBake sstate キャッシュ無効化用
repos:
  kart-machine-manager:
    url: "https://github.com/KART-Software/kart-machine-manager.git"
    refspec: 2caae856032174611bc259a383add17a0b9279e4
    path: kart-machine-manager
    layers:
      "": excluded

local_conf_header:
  app-embed: |
    KART_APP_SRC = "/work/kart-machine-manager"
    KART_APP_REVISION = "2caae856032174611bc259a383add17a0b9279e4"
